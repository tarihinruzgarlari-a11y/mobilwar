<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b14">
<title>Mobiwar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="res" title="Altın"><span>💰</span><b id="h-gold">0</b><small id="h-gr"></small></div>
  <div class="res" title="Yemek"><span>🍗</span><b id="h-food">0</b><small id="h-fr"></small></div>
  <div class="header-info">👑 <b id="h-nick">Admin</b> • <span id="h-coord">1.1</span></div>
  <div class="clock" id="h-clock"></div>
</header>

<main>
  <section id="tab-komuta" class="tab"></section>
  <section id="tab-sehir" class="tab"></section>
  <section id="tab-ordular" class="tab"></section>
  <section id="tab-harita" class="tab"></section>
  <section id="tab-mesaj" class="tab"></section>
  <section id="tab-daha" class="tab"></section>
</main>

<nav>
  <button id="nb-ordular" onclick="switchTab('ordular')"><span>🛡️</span><span>Durum</span></button>
  <button id="nb-sehir" onclick="switchTab('sehir')"><span>🏛️</span><span>Şehir</span></button>
  <button id="nb-harita" onclick="switchTab('harita')"><span>🗺️</span><span>Harita</span></button>
  <button id="nb-mesaj" onclick="switchTab('mesaj')"><span>✉️</span><span>Mesaj</span><span id="badge">!</span></button>
  <button id="nb-komuta" onclick="switchTab('komuta')"><span>👑</span><span>Komuta</span></button>
  <button id="nb-daha" onclick="switchTab('daha')"><span>⚙️</span><span>Daha</span></button>
</nav>

<div id="ov"><div id="ov-box"></div></div>
<div id="toasts"></div>
<div id="err"></div>

<script src="game.js"></script>
</body>
</html>
